name: Campus Kiru CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - feature/formador-role-foundation

permissions:
  contents: read

jobs:
  validate:
    name: Lint and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-placeholder
      SUPABASE_SERVICE_ROLE_KEY: build-placeholder
      GOOGLE_CLIENT_EMAIL: build-placeholder@example.iam.gserviceaccount.com
      GOOGLE_PRIVATE_KEY: build-placeholder
      GOOGLE_SHEETS_SPREADSHEET_ID: build-placeholder
      GOOGLE_SHEETS_RANGE: Sheet1!A:AZ
      NEXT_PUBLIC_APP_URL: https://example.com
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run ESLint
        run: npm run lint
      - name: Build production app
        run: npm run build
