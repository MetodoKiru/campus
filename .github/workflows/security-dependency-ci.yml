name: Security dependency patch validation

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - security/patch-nextjs-16-4-3

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-placeholder
      SUPABASE_SERVICE_ROLE_KEY: build-placeholder
      GOOGLE_CLIENT_EMAIL: build-placeholder@example.iam.gserviceaccount.com
      GOOGLE_PRIVATE_KEY: build-placeholder
      GOOGLE_SHEETS_SPREADSHEET_ID: build-placeholder
      GOOGLE_SHEETS_RANGE: Sheet1!A:AZ
      NEXT_PUBLIC_APP_URL: https://example.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies from lockfile
        run: npm ci
      - name: Fail if high or critical dependency advisories remain
        run: npm audit --audit-level=high
      - name: Build production app
        run: npm run build
