name: Refresh dependency lockfile

on:
  push:
    branches:
      - feature/formador-role-foundation
    paths:
      - package.json
      - .github/workflows/update-lockfile.yml

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/formador-role-foundation
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Resolve compatible dependency security updates
        run: |
          npm install --package-lock-only
          npm audit fix --package-lock-only
      - name: Commit updated lockfile if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already up to date."
          else
            git commit -m "chore(deps): refresh lockfile security fixes"
            git push origin HEAD:feature/formador-role-foundation
          fi
