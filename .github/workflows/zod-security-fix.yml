name: Patch Zod dependency advisory

on:
  push:
    branches:
      - security/patch-zod-4-6-7
    paths:
      - .github/workflows/zod-security-fix.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-placeholder
      SUPABASE_SERVICE_ROLE_KEY: build-placeholder
      GOOGLE_CLIENT_EMAIL: build-placeholder@example.iam.gserviceaccount.com
      GOOGLE_PRIVATE_KEY: build-placeholder
      GOOGLE_SHEETS_SPREADSHEET_ID: build-placeholder
      GOOGLE_SHEETS_RANGE: Sheet1!A:AZ
      NEXT_PUBLIC_APP_URL: https://example.com
    steps:
      - name: Checkout security branch
        uses: actions/checkout@v4
        with:
          ref: security/patch-zod-4-6-7
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Resolve compatible dependency security updates
        run: |
          npm install --package-lock-only
          npm audit fix --package-lock-only
      - name: Commit lockfile update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already up to date."
          else
            git commit -m "chore(deps): patch Zod security advisory"
            git push origin HEAD:security/patch-zod-4-6-7
          fi
      - name: Install exact dependency tree
        run: npm ci
      - name: Fail if high or critical dependency advisories remain
        run: npm audit --audit-level=high
      - name: Build production app
        run: npm run build
